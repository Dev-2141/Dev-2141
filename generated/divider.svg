<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64" role="img" aria-label="">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e9b949" stop-opacity="0"/><stop offset=".5" stop-color="#e9b949"/><stop offset="1" stop-color="#e9b949" stop-opacity="0"/></linearGradient></defs>
<style>
.l{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.6s cubic-bezier(.16,1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gem{animation:gem 6s ease-in-out infinite}
@keyframes gem{50%{transform:rotate(180deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(.2) rotate(0);opacity:.2}50%{transform:scale(1) rotate(90deg);opacity:1}} @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.18)}}
</style>
