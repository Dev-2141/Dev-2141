<g transform="translate(450,32)"><g class="gem"><path d="M0 -13 L13 0 L0 13 L-13 0Z" fill="#6b44c9" stroke="#e9b949" stroke-width="2"/><circle r="3" fill="#ffe08f"/></g></g>
<g transform="translate(320,22) scale(0.4)"><path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#e9b949" class="tw" style="animation-delay:0.5s"/></g><g transform="translate(590,44) scale(0.4)"><path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="#9d85ff" class="tw" style="animation-delay:1.5s"/></g>
