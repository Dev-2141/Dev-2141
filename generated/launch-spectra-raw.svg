<g clip-path="inset(0 round 4px)"><g class="grow"><rect x="0.0" y="0" width="209.5" height="8" fill="#3572A5"/><rect x="209.5" y="0" width="90.5" height="8" fill="#3178c6"/></g></g>
<circle cx="5" cy="24" r="4" fill="#3572A5"/><text x="14" y="28" class="s">Python 70%</text><circle cx="105" cy="24" r="4" fill="#3178c6"/><text x="114" y="28" class="s">TypeScript 30%</text>
</g></g>
