<text x="46" y="68" class="up" text-anchor="middle">0</text>
<text x="46" y="88" class="upl" text-anchor="middle">UPVOTE</text>
</g></g>
</a>
<path d="M36 180 H864" stroke="#21262d"/>
<g transform="translate(36,208)"><g class="in" style="animation-delay:.55s"><g transform="translate(0,0)"><text class="sv"><tspan class="si">★</tspan> 0</text><text y="18" class="s">stars</text></g><g transform="translate(118,0)"><text class="sv"><tspan class="si">⑂</tspan> 0</text><text y="18" class="s">forks</text></g><g transform="translate(236,0)"><text class="sv"><tspan class="si">◆</tspan> 11</text><text y="18" class="s">commits</text></g><g transform="translate(354,0)"><text class="sv"><tspan class="si">↑</tspan> 3 weeks</text><text y="18" class="s">since last ship</text></g></g></g>
