mation-delay:-5.90s;animation-duration:11.7s"/><rect x="347" y="260" width="4.3" height="6.8" rx="1" fill="#56d4dd" class="cf" style="animation-delay:-2.83s;animation-duration:11.5s"/><rect x="404" y="260" width="4.7" height="7.5" rx="1" fill="#a371f7" class="cf" style="animation-delay:-1.58s;animation-duration:8.4s"/><rect x="777" y="260" width="4.6" height="7.4" rx="1" fill="#f778ba" class="cf" style="animation-delay:-5.98s;animation-duration:7.5s"/><rect x="415" y="260" width="7.9" height="12.7" rx="1" fill="#e3b341" class="cf" style="animation-delay:-8.66s;animation-duration:9.9s"/><rect x="467" y="260" width="3.4" height="5.4" rx="1" fill="#56d4dd" class="cf" style="animation-delay:-7.41s;animation-duration:12.0s"/><rect x="162" y="260" width="7.2" height="11.5" rx="1" fill="#a371f7" class="cf" style="animation-delay:-8.24s;animation-duration:7.7s"/><rect x="165" y="260" width="6.9" height="11.0" rx="1" fill="#f778ba" class="cf" style="animation-delay:-0.46s;animation-duration:11.4s"/>
</g>
