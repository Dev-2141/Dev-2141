<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Edusphere launch card">
<defs>
<linearGradient id="logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a371f7"/><stop offset=".35" stop-color="#30363d"/><stop offset=".65" stop-color="#30363d"/><stop offset="1" stop-color="#f778ba"/>
<animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<radialGradient id="glow" cx="0.12" cy="0.3" r="0.6"><stop offset="0" stop-color="#a371f7" stop-opacity=".18"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="900" height="250" rx="18"/></clipPath>
<clipPath id="logoClip"><rect width="104" height="104" rx="24"/></clipPath>
</defs>
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
.eyebrow { font: 700 12px ConsolasFallback, Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; letter-spacing: 2.5px; fill: #a371f7; }
.name { font-size: 34px; font-weight: 800; }
.tl { font-size: 16.5px; fill: #adbac7; }
.tag { font-size: 12px; font-weight: 600; fill: #a371f7; }
.s { font-size: 12px; fill: #768390; }
.sv { font-size: 17px; font-weight: 700; }
.si { fill: #a371f7; }
.mono { font-size: 42px; font-weight: 900; fill: #0d1117; }
.up { font-size: 26px; font-weight: 800; }
.upl { font: 700 10px ConsolasFallback, Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #768390; }
.live { animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
.float { animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.shine { animation: shine 3.5s ease-in-out infinite; }
@keyframes shine { 0%, 55% { transform: translateX(-140px) skewX(-20deg); } 100% { transform: translateX(160px) skewX(-20deg); } }
.arrow { animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-5px); } }
.grow { transform-box: fill-box; transform-origin: left; animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both .4s; }
@keyframes grow { from { transform: scaleX(0); } }
.cf { opacity: .55; animation: rise linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rise { from { transform: translateY(0) rotate(0); } to { transform: translateY(-290px) rotate(540deg); } }
.in { opacity: 0; animation: in .6s ease-out forwards; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
<g clip-path="url(#card)">
<rect width="900" height="250" fill="#0d1117"/>
<rect width="900" height="250" fill="url(#glow)"/>
