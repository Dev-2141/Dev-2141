<text y="70" class="tl in" style="animation-delay:0.25s">Learn anything, Coursera-style — curated YouTube courses in</text><text y="92" class="tl in" style="animation-delay:0.33s">one clean platform.</text>
<g transform="translate(0,104)"><g class="in" style="animation-delay:.45s"><g transform="translate(0,0)"><rect width="66.4" height="24" rx="12" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="33.2" y="16.5" class="tag" text-anchor="middle">EdTech</text></g><g transform="translate(74.4,0)"><rect width="73.80000000000001" height="24" rx="12" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".35"/><text x="36.900000000000006" y="16.5" class="tag" text-anchor="middle">Web App</text></g></g></g>
</g>
