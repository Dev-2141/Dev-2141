<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="I'm a Daylight Builder">
<style>
text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
.h { font-size: 24px; font-weight: 800; }
.hl { fill: #ffa657; }
.sub { font: 12px ConsolasFallback, Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; fill: #768390; letter-spacing: 1.5px; }
.b { font-size: 15px; font-weight: 700; }
.s { font-size: 11.5px; fill: #768390; }
.v { font-size: 15px; font-weight: 700; font-family: ConsolasFallback, Consolas, 'SFMono-Regular', Menlo, 'Liberation Mono', monospace; }
.grow { transform-box: fill-box; transform-origin: left; animation: grow 1.3s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.rise { transform-box: fill-box; transform-origin: bottom; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { transform: scaleY(0); } }
.ic { animation: ic 3.2s ease-in-out infinite; }
@keyframes ic { 0%, 70%, 100% { transform: translate(10px,-5px) scale(1); } 35% { transform: translate(10px,-5px) scale(1.25); } }
</style>
