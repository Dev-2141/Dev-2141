name: build profile

on:
  schedule:
    - cron: "30 18 * * *" # daily, midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "profile.config.json", ".github/workflows/build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated README.md
          git diff --cached --quiet || git commit -m "chore: refresh live profile cards"
          git push
