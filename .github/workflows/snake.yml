name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_background=#150e26&color_snake=#e9b949&color_dots=#1f1537,#3a1f73,#6b44c9,#9d85ff,#c6b4ff
            dist/snake-light.svg?color_snake=#a87a12&color_dots=#f4ecdd,#e1d7ff,#c6b4ff,#9d85ff,#6b44c9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
