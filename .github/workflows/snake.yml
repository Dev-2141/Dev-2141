name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_background=#08080a&color_snake=#ff2b40&color_dots=#161619,#4a0711,#7d0a1c,#b5102a,#f1ebe6
            dist/snake-light.svg?palette=github-dark&color_background=#08080a&color_snake=#ff2b40&color_dots=#161619,#4a0711,#7d0a1c,#b5102a,#f1ebe6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
